<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/home.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <!--Bloco de Código do Nav-->
        <nav class="navbar bg-black fixed-top">

            <!--Bloco da barra de Pesquisa-->
            <div class="container-fluid">
                <div class="row w-100 align-items-center">
                    <div class="col-4">
                        <form class="d-flex" role="search">
                            <input class="searchBar form-control h-100 w-75 d-sm-none d-md-flex d-lg-flex" type="search"
                                placeholder="Pesquisar" aria-label="Search">
                            <button class="btn" type="submit"><img src="../img/lupa.png" alt=""
                                    style="width: 25px;"></button>
                        </form>
                    </div>

                    <!--Bloco da logo-->
                    <div class="col-4 text-center">
                        <a class="navbar-brand mx-auto"><img src="../img/LogoVetorizadodark.svg" alt="logo"
                                class="logo"></a>
                    </div>

                    <!--Bloco do Carrinho-->
                    <div class="col-4 d-flex justify-content-end cart">
                        <button class="navbar-toggler p-0" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#navbarOffcanvasLg" aria-controls="navbarOffcanvasLg"
                            aria-label="Toggle navigation">
                            <div class="imgnavcart"><img src="../img/carrinho-de-compras.png" alt=""><span class="badge"
                                    id="itens-on-cart">0</span></div>
                        </button>

                        <!--Off-canvas-->
                        <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvasLg"
                            aria-labelledby="navbarOffcanvasLgLabel">
                            <button type="button" class="btn-close text-bg-light" id="btn-close-canva"
                                data-bs-dismiss="offcanvas" aria-label="Close"></button>
                            <h3 class="m-2">Carrinho</h3>
                            <div class="offcanvas-body">
                                <ul id="carrinho-lista" class="p-0"></ul>
                                <div class="info-carrinho">
                                    <p><strong id="preco">Total R$ <span id="total">0,00</span></strong></p>
                                    <div id="Btn-limpar" class="Btn-limpar"></div>
                                    <div id="Btn-comprar" class="Btn-comprar"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div>
            <form class="row g-3 mt-5" id="pedidoForm">
                <h2>Dados para Entrega</h2>
                <div class="col-md-4 ">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" required>
                  </div>
                  <div class="col-md-4">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" required>
                  </div>
                  <div class="col-md-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="Email" required>
                  </div>
                  <div class="col-md-4">
                    <label for="numero" class="form-label">Número para contato</label>
                    <input type="tel" class="form-control" id="numContato" required>
                  </div>
                  <div>
                    <label for="cep">Digite seu CEP:</label>
                    <input type="text" class="form-control" id="CEP">
                  </div>
                  <div>
                    <label for="Endereço">Endereço</label>
                    <input type="text" class="form-control" id="endereco">
                  </div>
                  <div>
                    <label for="cidade">Cidade</label>
                    <input type="text" class="form-control" name="cidade" id="cidade">
                  </div>
                  <div class="col-12">
                    <button class="btn btn-primary" type="submit">Submit form</button>
                  </div>
            </form>
        </div>
        <div>
            <h2>Dados do pedido</h2>
            <div>
                <div>
                    <img src="" alt="">
                    info do produto
                    preço etc
                </div>
            </div>
            <div>
                total:R$19.99
            </div>
        </div>
    </main>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script src="../js/checkout.js"></script>
</html>
